# Syncs generated documentation to the EDDI wiki whenever a new release is published.

name: Sync Wiki

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  build-config: Release
  solution: EDDI.sln

jobs:
  sync_docs:
    name: Sync docs
    runs-on: windows-latest

    steps:
    - name: Checkout current version
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Add NuGet to PATH
      uses: nuget/setup-nuget@v4.0
      with:
        nuget-version: 'latest'

    - name: Restore dependencies
      run: nuget restore ${{ env.solution }} -NonInteractive

    - name: Build solution
      run: msbuild ${{ env.solution }} /p:Configuration=${{ env.build-config }} /p:Platform=x64 /p:UseSharedCompilation=false /verbosity:minimal

    - name: Generate updated wiki documentation
      id: wiki-output
      shell: pwsh
      run: |
        $outputRoot = Join-Path $env:RUNNER_TEMP "eddi-generated-documentation"
        if (Test-Path $outputRoot) {
          Remove-Item $outputRoot -Recurse -Force
        }

        dotnet `
          "${{ github.workspace }}\bin\Release\BuildTools\DocumentationGenerator\DocumentationGenerator.dll" `
          $outputRoot

        $wikiPath = Join-Path $outputRoot "Wiki"
        Write-Host "Generated wiki output at: $wikiPath"
        "path=$wikiPath" >> $env:GITHUB_OUTPUT

    - name: Validate generated wiki files
      shell: pwsh
      run: |
        $wikiPath = "${{ steps.wiki-output.outputs.path }}"

        if (-not (Test-Path $wikiPath -PathType Container)) {
          throw "Generated wiki output folder was not found: $wikiPath"
        }

        $requiredFiles = @(
          "Events.md",
          "Variables.md",
          "VoiceAttack-Integration.md",
          "Help.md",
          "Functions.md"
        )

        foreach ($requiredFile in $requiredFiles) {
          $path = Join-Path $wikiPath $requiredFile
          if (-not (Test-Path $path -PathType Leaf)) {
            throw "Generated wiki output is incomplete. Missing required file: $path"
          }

          if ((Get-Item $path).Length -le 0) {
            throw "Generated wiki output file is empty: $path"
          }

          if (Select-String -Path $path -Pattern "{{" -SimpleMatch -Quiet) {
            throw "Generated wiki output contains an unreplaced template placeholder: $path"
          }
        }

        $eventsPath = Join-Path $wikiPath "events"
        if (-not (Test-Path $eventsPath -PathType Container)) {
          throw "Generated event wiki folder was not found: $eventsPath"
        }

        $eventPages = Get-ChildItem $eventsPath -Filter "*.md" -File
        if (-not $eventPages) {
          throw "Generated event wiki folder is empty: $eventsPath"
        }

        Write-Host "Validated generated wiki output: $($requiredFiles.Count) top-level files and $($eventPages.Count) event pages."

    - name: Clone wiki repository
      shell: pwsh
      env:
        GH_ACCESS_TOKEN: ${{ secrets.GH_ACTIONS_TOKEN }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:GH_ACCESS_TOKEN)) {
          throw "The GH_ACTIONS_TOKEN secret is missing or empty."
        }

        git clone "https://x-access-token:$env:GH_ACCESS_TOKEN@github.com/EDCD/EDDI.wiki.git" wiki-repo

    - name: Sync generated files into wiki repo
      shell: pwsh
      run: |
        $source = "${{ steps.wiki-output.outputs.path }}"
        $target = "${{ github.workspace }}\wiki-repo"

        if (-not (Test-Path $source)) {
          throw "Generated wiki output folder was not found: $source"
        }

        if (-not (Test-Path $target)) {
          throw "Wiki repo folder was not found: $target"
        }

        $generatedItems = Get-ChildItem $source -Force

        if (-not $generatedItems) {
          throw "Generated wiki output folder is empty: $source"
        }

        foreach ($item in $generatedItems) {
          $targetPath = Join-Path $target $item.Name

          if ($item.PSIsContainer) {
            # A generated top-level directory owns the matching wiki directory.
            # Delete the existing target directory first so removed nested files/folders are purged.
            if (Test-Path $targetPath) {
              if (-not (Test-Path $targetPath -PathType Container)) {
                throw "Cannot replace file '$targetPath' with generated directory '$($item.FullName)'."
              }

              Remove-Item $targetPath -Recurse -Force
            }

            Copy-Item $item.FullName $target -Recurse -Force
            Write-Host "Mirrored generated directory: $($item.Name)"
          }
          else {
            # A generated top-level file owns the matching wiki file.
            # If a directory exists with the same name, fail rather than deleting it silently.
            if (Test-Path $targetPath -PathType Container) {
              throw "Cannot replace directory '$targetPath' with generated file '$($item.FullName)'."
            }

            Copy-Item $item.FullName $targetPath -Force
            Write-Host "Copied generated file: $($item.Name)"
          }
        }

    - name: Commit and push wiki changes
      shell: pwsh
      working-directory: wiki-repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git status --short

        if (-not (git status --short)) {
          Write-Host "No wiki changes to commit."
          exit 0
        }

        git add .
        git commit -m "Update generated wiki documentation"
        git push
